server:
  port: 8080

spring:
  application:
    name: library-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/library?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # 关键：springfox 3.0 在 Spring Boot 2.6+ 需要改为 ant_path_matcher，否则启动报 NPE
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

knife4j:
  enable: true
  production: false

# JWT 配置
jwt:
  secret: library-management-system-secret-key-please-change-it-in-production
  expire: 86400000   # 令牌有效期（毫秒），默认 24 小时
